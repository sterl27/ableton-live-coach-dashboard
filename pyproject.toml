[project]
name = "ableton-live-coach-ml"
version = "0.1.0"
description = "Python audio-analysis and Supabase tooling for Ableton Live Coach"
requires-python = ">=3.13,<3.14"
dependencies = [
  "ipykernel>=6.30,<7",
  "jupyterlab>=4.4,<5",
  "librosa>=0.11,<0.12",
  "matplotlib>=3.10,<4",
  "numpy>=2.3,<2.4",
  "pandas>=2.3,<4",
  "psycopg2==2.9.11",
  "python-dotenv>=1.1,<2",
  "scipy>=1.16,<1.17",
  "soundfile>=0.13,<0.14",
]

[tool.uv]
package = false
